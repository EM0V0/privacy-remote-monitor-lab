name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  SESSION_SECRET: ci-session-secret-min-16chars
  INGEST_SECRET: ci-ingest-secret-min-16chars
  DATABASE_URL: file:./ci-e2e.db
  SHOWCASE_DEMO_PASSWORD: showcase
  E2E_DEMO_PASSWORD: showcase

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (skip postinstall prisma rename races)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare SQLite database & seed
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
